version: "2"

# Shared with the Axon switch agent so both Go codebases enforce the same
# practices. Applies to the root module and, via upward config resolution, to
# the desktop module (make lint runs the linter in both).
linters:
  default: none
  enable:
    # Declaration / structure ordering.
    - grouper
    - decorder
    # Correctness & dead code.
    - govet
    - errcheck
    - ineffassign
    - wastedassign
    - unused
    - staticcheck
    # Error-handling hygiene. The codebase wraps errors with %w at appropriate
    # boundaries and exposes sentinels via errors.Is/errors.As; these guard
    # that convention against regressions.
    - errorlint
    - errname
    - forcetypeassert
    # Modern Go hygiene (module is go 1.26).
    - copyloopvar
    - fatcontext
    - predeclared
    # Logging style for log/slog.
    - sloglint
    # Structural cleanliness.
    - embeddedstructfieldcheck
    - dupl
    - iface
    - modernize
    # Extra bug/idiom catches not covered by govet/staticcheck.
    - gocritic
    # Documentation practice (basic rules only).
    - godoclint
  settings:
    grouper:
      const-require-single-const: true
      const-require-grouping: true
      import-require-single-import: true
      import-require-grouping: true
      type-require-single-type: true
      type-require-grouping: true
      var-require-single-var: true
      var-require-grouping: true
    decorder:
      dec-order:
        - type
        - const
        - var
        - func
    errcheck:
      # Flag unchecked type assertions (e.g. x.(T) without comma-ok).
      check-type-assertions: true
      # Errors deliberately discarded for idiomatic CLI output.
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    godoclint:
      default: basic
